rules:
  # ---------------------------------------------------------------- Injection SQL (Sequelize)
  - id: custom-sequelize-query-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Requête SQL construite par concaténation ou interpolation de chaîne passée à sequelize.query().
      Utiliser des requêtes paramétrées (replacements / bind).
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: $DB.query(<... "..." + $X ...>, ...)
      - pattern: $DB.query(`...${$X}...`, ...)

  - id: custom-sequelize-query-template-literal
    languages: [javascript, typescript]
    severity: ERROR
    message: "Requête SQL en template literal avec interpolation ${...} passée à .query() : injection SQL possible."
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
    pattern-regex: '\.query\(\s*`[^`]*\$\{'

  # ---------------------------------------------------------------- Clé privée codée en dur
  - id: custom-hardcoded-private-key
    languages: [generic]
    paths:
      include: ["*.ts", "*.js", "*.json", "*.yml", "*.yaml", "*.env"]
    severity: ERROR
    message: Clé privée PEM codée en dur dans le code source. Elle doit venir d'un secret externe.
    metadata:
      cwe: ["CWE-321: Use of Hard-coded Cryptographic Key"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: security
      confidence: HIGH
    pattern-regex: '-----BEGIN (RSA |EC |)PRIVATE KEY-----'

  # ---------------------------------------------------------------- eval avec entrée non littérale
  - id: custom-eval-non-literal
    languages: [javascript, typescript]
    severity: WARNING
    message: eval() appelé avec une valeur non littérale ; risque d'exécution de code arbitraire.
    metadata:
      cwe: ["CWE-95: Eval Injection"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")

  # ---------------------------------------------------------------- XXE (libxmljs, noent)
  - id: custom-xml-external-entities
    languages: [javascript, typescript]
    severity: ERROR
    message: "Parseur XML avec noent=true : les entités externes sont résolues (XXE)."
    metadata:
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      category: security
      confidence: HIGH
    pattern: '$L.parseXml($D, {..., noent: true, ...})'

  # ---------------------------------------------------------------- Redirection ouverte
  - id: custom-open-redirect-user-input
    languages: [javascript, typescript]
    severity: WARNING
    message: Redirection dont la cible vient directement de la requête (redirection ouverte possible).
    metadata:
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: res.redirect(req.query.$P)
      - pattern: res.redirect(req.body.$P)
      - pattern: res.redirect(req.params.$P)

  # ---------------------------------------------------------------- XXE dans une chaîne évaluée (vm.runInContext)
  - id: custom-xml-noent-regex
    languages: [javascript, typescript]
    severity: ERROR
    message: "Parseur XML avec noent: true, y compris lorsque le code est dans une chaîne évaluée : entités externes résolues (XXE)."
    metadata:
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      category: security
      confidence: MEDIUM
    pattern-regex: 'parseXml\([^)]*noent:\s*true'
